name = "c2_riemannian_minimal"
version = "0.1.0"
defaultTargets = ["C2RiemannianMinimal"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "TauCeti"
globs = ["TauCeti.+"]

[[lean_lib]]
name = "C2Riemannian"
globs = ["C2Riemannian.+"]

[[lean_lib]]
name = "C2RiemannianMinimal"
